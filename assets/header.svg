<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380" role="img" aria-label="Siddharth Taurani — AI Engineer in the making">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070a14"/>
      <stop offset="1" stop-color="#0d1222"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0" gradientUnits="objectBoundingBox">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="0.33" stop-color="#22d3ee"/>
      <stop offset="0.66" stop-color="#f472b6"/>
      <stop offset="1" stop-color="#a78bfa"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-1 0;0 0;-1 0" dur="8s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a78bfa" stop-opacity=".05"/>
      <stop offset=".5" stop-color="#22d3ee" stop-opacity=".35"/>
      <stop offset="1" stop-color="#f472b6" stop-opacity=".05"/>
    </linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="60"/></filter>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity=".035"/>
    </pattern>
    <clipPath id="frame"><rect width="1200" height="380" rx="24"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="380" fill="url(#bg)"/>

    <!-- aurora blobs -->
    <g filter="url(#blur)" opacity=".55">
      <circle r="170" fill="#7c3aed">
        <animate attributeName="cx" values="180;420;180" dur="18s" repeatCount="indefinite"/>
        <animate attributeName="cy" values="60;180;60" dur="14s" repeatCount="indefinite"/>
      </circle>
      <circle r="150" fill="#0891b2">
        <animate attributeName="cx" values="980;760;980" dur="16s" repeatCount="indefinite"/>
        <animate attributeName="cy" values="300;140;300" dur="20s" repeatCount="indefinite"/>
      </circle>
      <circle r="120" fill="#db2777" opacity=".7">
        <animate attributeName="cx" values="640;880;640" dur="22s" repeatCount="indefinite"/>
        <animate attributeName="cy" values="380;260;380" dur="17s" repeatCount="indefinite"/>
      </circle>
    </g>
    <rect width="1200" height="380" fill="url(#grid)"/>

    <!-- neural network (right side) -->
    <g transform="translate(790 70)">
      <g stroke="url(#edge)" stroke-width="1.2" fill="none">
        <path id="e1" d="M0 40 L150 0"/><path id="e2" d="M0 40 L150 80"/><path d="M0 40 L150 160"/>
        <path d="M0 120 L150 0"/><path id="e3" d="M0 120 L150 80"/><path d="M0 120 L150 160"/><path d="M0 120 L150 240"/>
        <path d="M0 200 L150 80"/><path id="e4" d="M0 200 L150 160"/><path d="M0 200 L150 240"/>
        <path id="f1" d="M150 0 L300 80"/><path d="M150 80 L300 80"/><path id="f2" d="M150 160 L300 160"/>
        <path d="M150 240 L300 160"/><path d="M150 0 L300 160"/><path d="M150 240 L300 80"/>
      </g>
      <!-- signals -->
      <g fill="#22d3ee" filter="url(#glow)">
        <circle r="3.5"><animateMotion dur="2.4s" repeatCount="indefinite"><mpath href="#e1"/></animateMotion></circle>
        <circle r="3.5" fill="#f472b6"><animateMotion dur="2.8s" begin=".6s" repeatCount="indefinite"><mpath href="#e3"/></animateMotion></circle>
        <circle r="3.5" fill="#a78bfa"><animateMotion dur="2.2s" begin="1.1s" repeatCount="indefinite"><mpath href="#e4"/></animateMotion></circle>
        <circle r="3.5"><animateMotion dur="2.6s" begin="1.4s" repeatCount="indefinite"><mpath href="#e2"/></animateMotion></circle>
        <circle r="3.5" fill="#f472b6"><animateMotion dur="2s" begin=".3s" repeatCount="indefinite"><mpath href="#f1"/></animateMotion></circle>
        <circle r="3.5" fill="#a78bfa"><animateMotion dur="2.3s" begin="1.6s" repeatCount="indefinite"><mpath href="#f2"/></animateMotion></circle>
      </g>
      <!-- nodes -->
      <g stroke-width="2" fill="#0b1020">
        <circle cx="0" cy="40" r="9" stroke="#a78bfa"><animate attributeName="r" values="9;11;9" dur="3s" repeatCount="indefinite"/></circle>
        <circle cx="0" cy="120" r="9" stroke="#a78bfa"><animate attributeName="r" values="9;11;9" dur="3s" begin="1s" repeatCount="indefinite"/></circle>
        <circle cx="0" cy="200" r="9" stroke="#a78bfa"><animate attributeName="r" values="9;11;9" dur="3s" begin="2s" repeatCount="indefinite"/></circle>
        <circle cx="150" cy="0" r="9" stroke="#22d3ee"><animate attributeName="r" values="9;11;9" dur="2.5s" begin=".4s" repeatCount="indefinite"/></circle>
        <circle cx="150" cy="80" r="9" stroke="#22d3ee"><animate attributeName="r" values="9;11;9" dur="2.5s" begin="1.2s" repeatCount="indefinite"/></circle>
        <circle cx="150" cy="160" r="9" stroke="#22d3ee"><animate attributeName="r" values="9;11;9" dur="2.5s" begin="2s" repeatCount="indefinite"/></circle>
        <circle cx="150" cy="240" r="9" stroke="#22d3ee"><animate attributeName="r" values="9;11;9" dur="2.5s" begin=".8s" repeatCount="indefinite"/></circle>
        <circle cx="300" cy="80" r="11" stroke="#f472b6" filter="url(#glow)"><animate attributeName="r" values="11;14;11" dur="2s" repeatCount="indefinite"/></circle>
        <circle cx="300" cy="160" r="11" stroke="#f472b6" filter="url(#glow)"><animate attributeName="r" values="11;14;11" dur="2s" begin="1s" repeatCount="indefinite"/></circle>
      </g>
    </g>

    <!-- left: identity -->
    <g font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
      <text x="72" y="104" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" fill="#8b93b3" letter-spacing="3">
        ~/paris · aivancity · PGE 4
        <animate attributeName="opacity" values="0;1" dur="1s" fill="freeze"/>
      </text>
      <text x="68" y="180" font-size="70" font-weight="800" fill="url(#name)" letter-spacing="-1.5">Siddharth Taurani</text>
      <text x="72" y="226" font-size="23" fill="#c9d1e6" font-weight="500">
        AI Engineer in the making — <tspan fill="#22d3ee">RAG</tspan> · <tspan fill="#a78bfa">Agents</tspan> · <tspan fill="#f472b6">LLM reliability</tspan>
      </text>

      <!-- status pill -->
      <g transform="translate(72 262)">
        <rect width="318" height="40" rx="20" fill="#0f172a" stroke="#22c55e" stroke-opacity=".45"/>
        <circle cx="24" cy="20" r="6" fill="#22c55e"/>
        <circle cx="24" cy="20" r="6" fill="none" stroke="#22c55e" stroke-width="2">
          <animate attributeName="r" values="6;14" dur="1.8s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values=".9;0" dur="1.8s" repeatCount="indefinite"/>
        </circle>
        <text x="44" y="26" font-size="16" fill="#d1fae5" font-weight="600">Open to alternance · AI / Data</text>
      </g>
    </g>

    <!-- scanline shimmer -->
    <rect x="-300" y="0" width="200" height="380" fill="#ffffff" opacity=".035" transform="skewX(-20)">
      <animate attributeName="x" values="-300;1500" dur="6s" repeatCount="indefinite"/>
    </rect>
    <rect width="1199" height="379" x=".5" y=".5" rx="24" fill="none" stroke="#ffffff" stroke-opacity=".08"/>
  </g>
</svg>
