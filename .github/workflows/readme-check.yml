name: README check

# Fails fast if README.md has merge-conflict markers, points at a ./assets file
# that doesn't exist, or if any hand-written SVG in assets/ is malformed XML.

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install xmllint
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libxml2-utils >/dev/null
      - name: Run guard checks
        run: bash scripts/check_readme.sh
