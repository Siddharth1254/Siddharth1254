name: Update README cards

# Builds the stats, top-languages and pinned-repo cards as static SVGs inside
# this repo, so the profile never depends on the overloaded public
# github-readme-stats server.

on:
  schedule:
    - cron: "17 3 * * *"   # once a day
  workflow_dispatch:        # run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  cards:
    runs-on: ubuntu-latest
    env:
      THEME: hide_border=true&bg_color=0b1020&title_color=a78bfa&icon_color=22d3ee&text_color=c9d1e6
    steps:
      - uses: actions/checkout@v4

      - name: Stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&include_all_commits=true&${{ env.THEME }}&ring_color=f472b6
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=6&${{ env.THEME }}
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Pin — mcp-debugging-agent
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=${{ github.repository_owner }}&repo=mcp-debugging-agent&${{ env.THEME }}
          path: profile/pin-mcp-debugging-agent.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Pin — ai-cold-email-generator
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=${{ github.repository_owner }}&repo=ai-cold-email-generator&${{ env.THEME }}
          path: profile/pin-ai-cold-email-generator.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Pin — alterna-genie-mvp
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=${{ github.repository_owner }}&repo=alterna-genie-mvp&${{ env.THEME }}&title_color=f472b6
          path: profile/pin-alterna-genie-mvp.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Pin — portfolio-website
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=${{ github.repository_owner }}&repo=portfolio-website&${{ env.THEME }}&title_color=f472b6
          path: profile/pin-portfolio-website.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "Update README cards" || exit 0
          git pull --rebase
          git push
